name: OpenWrt package build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Static checks and host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check shell, JavaScript and JSON syntax
        shell: bash
        run: |
          bash -n scripts/build-sdk.sh
          bash -n package/meshd/tests/run-wifi.sh
          sh -n scripts/pki.sh
          sh -n package/meshd/files/meshd.init
          sh -n package/meshd/files/meshd.defaults
          shopt -s globstar
          for js in luci-app-meshd/htdocs/**/*.js; do node --check "$js"; done
          python3 -m json.tool luci-app-meshd/root/usr/share/luci/menu.d/luci-app-meshd.json >/dev/null
          python3 -m json.tool luci-app-meshd/root/usr/share/rpcd/acl.d/luci-app-meshd.json >/dev/null
      - run: python3 -m unittest discover -s tests -v
      - run: make -C tests test
      - run: node luci-app-meshd/tests/smoke.cjs

  sdk:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenWrt 24.10.5 x86/64 IPK
            profile: x86-64-ipk
            format: ipk
            wifi_test: '1'
            artifact: openwrt-24.10.5-x86-64-ipk
          - name: OpenWrt 25.12.6 ARM64 Cortex-A53 APK
            profile: aarch64-cortex-a53-apk
            format: apk
            wifi_test: '0'
            artifact: openwrt-25.12.6-aarch64-cortex-a53-apk
          - name: OpenWrt 24.10.5 ARM64 Cortex-A53 IPK
            profile: aarch64-cortex-a53-ipk
            format: ipk
            wifi_test: '0'
            artifact: openwrt-24.10.5-aarch64-cortex-a53-ipk
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install SDK host dependencies (runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils curl file gawk gettext git libncurses-dev \
            patch perl pkgconf python3 rsync unzip wget zlib1g-dev zstd
      - name: Verify official SDK and build plugin packages
        env:
          SDK_PROFILE: ${{ matrix.profile }}
          SDK_WIFI_TEST: ${{ matrix.wifi_test }}
          SDK_OUTPUT_DIR: ${{ runner.temp }}/meshd-packages
        run: bash scripts/build-sdk.sh "$SDK_PROFILE"
      - name: Upload plugin packages (not firmware)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/meshd-packages/*.${{ matrix.format }}
          if-no-files-found: error
