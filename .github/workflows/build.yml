name: OpenWrt package build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Static checks and host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check shell, JavaScript and JSON syntax
        shell: bash
        run: |
          bash -n scripts/build-sdk.sh
          sh -n package/wifiroam/files/wifiroam.init
          shopt -s globstar
          for js in luci-app-wifiroam/htdocs/**/*.js; do
            { echo 'function __check(){'; cat "$js"; echo '}'; } > /tmp/wr-check.cjs
            node --check /tmp/wr-check.cjs || exit 1
          done
          python3 -m json.tool luci-app-wifiroam/root/usr/share/luci/menu.d/luci-app-wifiroam.json >/dev/null
          python3 -m json.tool luci-app-wifiroam/root/usr/share/rpcd/acl.d/luci-app-wifiroam.json >/dev/null
      - name: Verify backend/frontend contract
        run: python3 tests/test_contract.py

  sdk:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenWrt 24.10.5 x86/64 IPK
            profile: x86-64-ipk
            format: ipk
            artifact: openwrt-24.10.5-x86-64-ipk
          - name: OpenWrt 25.12.6 ARM64 Cortex-A53 APK
            profile: aarch64-cortex-a53-apk
            format: apk
            artifact: openwrt-25.12.6-aarch64-cortex-a53-apk
          - name: OpenWrt 24.10.5 ARM64 Cortex-A53 IPK
            profile: aarch64-cortex-a53-ipk
            format: ipk
            artifact: openwrt-24.10.5-aarch64-cortex-a53-ipk
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install SDK host dependencies (runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils curl file gawk gettext git libncurses-dev \
            patch perl pkgconf python3 rsync unzip wget zlib1g-dev zstd
      - name: Verify official SDK and build plugin packages
        env:
          SDK_PROFILE: ${{ matrix.profile }}
          SDK_OUTPUT_DIR: ${{ runner.temp }}/wifiroam-packages
        run: bash scripts/build-sdk.sh "$SDK_PROFILE"
      - name: Upload plugin packages (not firmware)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/wifiroam-packages/*.${{ matrix.format }}
          if-no-files-found: error
